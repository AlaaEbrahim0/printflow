name: printsheet

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printsheet}
      POSTGRES_USER: ${POSTGRES_USER:-printsheet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printsheet_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./api
    user: "${PRINTSHEET_STORAGE_UID:-1000}:${PRINTSHEET_STORAGE_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Postgres
      ConnectionStrings__PrintSheet: Host=postgres;Port=5432;Database=${POSTGRES_DB:-printsheet};Username=${POSTGRES_USER:-printsheet};Password=${POSTGRES_PASSWORD:-printsheet_dev_only}
      Storage__Root: /data/storage
      Worker__Key: ${WORKER_KEY:-dev-worker-key}
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-5173}
      BackgroundRemoval__DefaultProvider: ${BACKGROUND_REMOVAL_PROVIDER:-withoutbg}
      BackgroundRemoval__FallbackProvider: ${BACKGROUND_REMOVAL_FALLBACK:-}
      BackgroundRemoval__RunJobs: ${BACKGROUND_REMOVAL_RUN_JOBS:-true}
      BackgroundRemoval__AlphaContractPx: ${BACKGROUND_REMOVAL_ALPHA_CONTRACT_PX:-2}
      BackgroundRemoval__Poof__ApiKey: ${POOF_API_KEY:-}
      BackgroundRemoval__PrepareWorker__BaseUrl: ${BACKGROUND_REMOVAL_PREPARE_WORKER_BASE_URL:-http://worker:8000}
      BackgroundRemoval__PrepareWorker__UseGpu: ${WORKER_GPU_ENABLED:-false}
      BackgroundRemoval__PrepareWorker__MaxOutputPixels: ${BACKGROUND_REMOVAL_PREPARE_WORKER_MAX_OUTPUT_PIXELS:-24000000}
      BackgroundRemoval__WithoutBg__BaseUrl: http://withoutbg:8000
      BackgroundRemoval__WithoutBg__MaxInputPixels: ${BACKGROUND_REMOVAL_WITHOUTBG_MAX_INPUT_PIXELS:-1000000}
      BackgroundRemoval__Poof__MaxInputPixels: ${BACKGROUND_REMOVAL_POOF_MAX_INPUT_PIXELS:-24000000}
    # Lets a container reach a host port. Point
    # BackgroundRemoval__PrepareWorker__BaseUrl at http://host.docker.internal:8001
    # with WORKER_GPU_ENABLED=true to use the native GPU worker, but confirm the
    # host firewall allows it first:
    #   docker compose exec api curl -sf http://host.docker.internal:8001/health
    # On the reference workstation host ports time out from inside the container,
    # so that path is documented but not usable there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./storage:/data/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    user: "${PRINTSHEET_STORAGE_UID:-1000}:${PRINTSHEET_STORAGE_GID:-1000}"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PRINTSHEET_API_BASE_URL: http://api:8080
      PRINTSHEET_STORAGE_ROOT: /data/storage
      PRINTSHEET_WORKER_KEY: ${WORKER_KEY:-dev-worker-key}
      PRINTSHEET_WORKER_ID: worker-compose
      PRINTSHEET_GPU_ENABLED: "false"
      PRINTSHEET_REALESRGAN_BINARY: /tools/realesrgan-ncnn-vulkan
      PRINTSHEET_REALESRGAN_MODEL_DIR: /tools/models
      PRINTSHEET_RUN_JOBS: "true"
      PRINTSHEET_LOG_LEVEL: INFO
      PRINTSHEET_LOG_JSON: "true"
    ports:
      - "${WORKER_PORT:-8000}:8000"
    volumes:
      - ./storage:/data/storage
      - ./.tools/realesrgan-v0.2.5.0:/tools:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  withoutbg:
    # Self-hosted background removal. Pinned by digest so a re-tagged `latest`
    # cannot silently change the model; bump deliberately after reviewing the
    # release notes and running the pipeline smoke test.
    image: withoutbg/withoutbg-openweights-v4-service-cpu:latest@sha256:e4f9cbf612b265acec0f50d7fb41b885abdd16ec908ab717b27cbc80094b83a2
    environment:
      # Keep the open-weights engine: it never sends images off the machine.
      WITHOUTBG_API_KEY: ""
      WITHOUTBG_PRO_PASSWORD: ""
    ports:
      - "${WITHOUTBG_PORT:-8002}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      # The 1.5 GB model must load before /ready succeeds.
      start_period: 120s
      retries: 20
    restart: unless-stopped

  packer:
    build:
      context: .
      dockerfile: packer/Dockerfile
    user: "${PRINTSHEET_STORAGE_UID:-1000}:${PRINTSHEET_STORAGE_GID:-1000}"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PRINTSHEET_PACKER_API_BASE_URL: http://api:8080
      PRINTSHEET_PACKER_WORKER_KEY: ${WORKER_KEY:-dev-worker-key}
      PRINTSHEET_PACKER_WORKER_ID: packer-compose
      PRINTSHEET_PACKER_LOG_LEVEL: INFO
      PRINTSHEET_STORAGE_ROOT: /data/storage
    volumes:
      - ./storage:/data/storage
    restart: unless-stopped

  web:
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
