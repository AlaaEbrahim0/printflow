[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "printsheet-worker"
version = "0.1.0"
description = "Image-processing worker for PrintSheet Workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "Pillow>=11,<14",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  # Background removal is a colour key plus mask shaping (grow/contract, feather,
  # levels) on OpenCV arrays -- no model runtime. The BiRefNet ONNX engine is
  # archived under archive/birefnet/ and is not a dependency of the worker.
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]
# Kept as an empty extra so existing installs (`pip install -e '.[gpu]'`) do not
# break. GPU inference now only concerns Real-ESRGAN, which runs as a Vulkan
# binary rather than a Python package.
gpu = []
[project.scripts]
printsheet-worker = "app.cli:main"

[tool.hatch.build.targets.wheel]
# Everything under app/ ships, including the vendored app/_contracts schemas the
# container image needs (its build context is worker/ only).
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
