[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "printsheet-worker"
version = "0.1.0"
description = "Image-processing worker for PrintSheet Workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "Pillow>=11,<14",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  # Background removal. The BiRefNet graph is run directly through onnxruntime;
  # rembg is deliberately not a dependency (it would pull scipy, scikit-image,
  # pymatting, numba and pooch for a single model call).
  "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]
# GPU inference for background removal. The CUDA runtime is supplied by the base
# image (see Dockerfile); installing this in the slim CPU image only adds a shim
# that cannot load, so it is opt-in rather than a hard dependency.
gpu = [
  "onnxruntime-gpu>=1.20,<2",
]
[project.scripts]
printsheet-worker = "app.cli:main"

[tool.hatch.build.targets.wheel]
# Everything under app/ ships, including the vendored app/_contracts schemas the
# container image needs (its build context is worker/ only).
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
